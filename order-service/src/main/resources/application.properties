server.port=8083
spring.application.name=order-service

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

#spring.datasource.url=jdbc:mysql://localhost:3306/microservices
spring.datasource.url=jdbc:mysql://mysql:3306/microservices
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================
# KAFKA
# =========================
spring.kafka.bootstrap-servers=kafka:9092
#spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Feign HTTP timeout
spring.cloud.openfeign.client.config.PRODUCT-SERVICE.connectTimeout=2000
spring.cloud.openfeign.client.config.PRODUCT-SERVICE.readTimeout=3000

# =========================
# Resilience4j
# =========================

resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s

# ===============================
# Resilience4j Circuit Breaker
# ===============================

resilience4j.circuitbreaker.instances.productService.register-health-indicator=true
resilience4j.circuitbreaker.instances.productService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.productService.sliding-window-size=5
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true

# ==============================
# Resilience4j Retry
# ==============================

resilience4j.retry.instances.productService.max-attempts=3
resilience4j.retry.instances.productService.wait-duration=1s


# ==============================
# Resilience4j TimeLimiter
# ==============================

resilience4j.timelimiter.instances.productService.timeout-duration=3s


# actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
#prometheus
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# =========================
# DISTRIBUTED TRACING
# =========================

management.tracing.sampling.probability=1.0

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
